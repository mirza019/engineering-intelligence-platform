[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "engineering-intelligence-platform"
version = "0.1.0"
description = "Synthetic engineering intelligence, governance, RAG, MCP, and agent platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mcp>=1.2,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "sentence-transformers>=3.3,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["backend/app", "mcp_server"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E702", "B008", "B017"]
