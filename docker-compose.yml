services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: engineering_intelligence
      POSTGRES_USER: engineering_app
      POSTGRES_PASSWORD: engineering_app
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engineering_app -d engineering_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: {context: ., dockerfile: Dockerfile.backend}
    environment:
      DATABASE_URL: postgresql+psycopg://engineering_app:engineering_app@db:5432/engineering_intelligence
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      LLM_PROVIDER: ollama
      LLM_MODEL: qwen2.5:7b
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  postgres_data:
